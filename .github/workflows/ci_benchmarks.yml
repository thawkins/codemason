name: CI Benchmarks

on:
  # Manual only: run it from the Actions tab ("Run workflow"). It no longer
  # runs on every push and pull request.
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run benchmarks (criterion)
        # No `|| true`: a bench that fails to build or panics must fail the run
        # (RS-22). `timeout` still bounds it.
        run: timeout 1800s cargo bench --workspace
