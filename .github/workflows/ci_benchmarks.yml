name: CI Benchmarks

on:
  # Manual only: run it from the Actions tab ("Run workflow"). It no longer
  # runs on every push and pull request.
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run benchmarks (criterion)
        run: timeout 1800s cargo bench --workspace || true
