# cargo-audit configuration for codemason.
# Kept in sync with deny.toml: only advisories that still apply to the current
# dependency tree are listed here, so a re-introduced vulnerable crate is never
# silently masked.
[advisories]
# `paste` (RUSTSEC-2024-0436) is not ignored: it no longer matches the current
# tree (cargo-deny reported `advisory-not-detected`). The entries below are the
# unmaintained advisories pulled in by egui/eframe, identical to deny.toml.
ignore = [
    # `ttf-parser` is unmaintained (not a vulnerability); transitive via egui/eframe (epaint fonts).
    # No safe upgrade is available; revisit when egui is bumped.
    "RUSTSEC-2026-0192",
    # `zbus_names` is unmaintained (not a vulnerability); transitive via egui/eframe (accesskit_unix/atspi/zbus a11y).
    # No safe upgrade is available; revisit when egui is bumped.
    "RUSTSEC-2026-0371",
    # `zvariant` is unmaintained (not a vulnerability); transitive via egui/eframe (accesskit_unix/atspi/zbus a11y).
    # No safe upgrade is available; revisit when egui is bumped.
    "RUSTSEC-2026-0370",
    # `zvariant_derive` is unmaintained (not a vulnerability); transitive via egui/eframe (accesskit_unix/atspi/zbus a11y).
    # No safe upgrade is available; revisit when egui is bumped.
    "RUSTSEC-2026-0372",
    # `chrono` is unmaintained (not a vulnerability; RUSTSEC-2026-0543 covers all
    # versions). It is a direct workspace dependency (14 crates); replacing it
    # with the recommended `jiff` is a separate migration ticket.
    "RUSTSEC-2026-0543",
]
