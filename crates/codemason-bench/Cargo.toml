[package]
name = "codemason-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Benchmark suite runner for codemason — local AI coding benchmarks"

autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
# Workspace deps
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# XLSX writer for `src/xlsx.rs` (benchmark workbooks).
rust_xlsxwriter.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest.workspace = true
async-trait = { workspace = true }

# Internal crates
codemason-agent = { path = "../codemason-agent" }
codemason-llm = { path = "../codemason-llm" }
codemason-types = { path = "../codemason-types" }

[dev-dependencies]
ctor = { workspace = true }
# Used only by `benches/agent_loop.rs` and `tests/test_bench_core.rs`.
rustc-hash = { workspace = true }
tempfile = "3.14"
criterion = { workspace = true }
# Only `tests/test_bench_core.rs` opens a workbook; the library never does, so
# this stays a dev-dependency rather than an unused runtime one.
calamine = { workspace = true }

[[bench]]
name = "agent_loop"
harness = false

[lints]
workspace = true
