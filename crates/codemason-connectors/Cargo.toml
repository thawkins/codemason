[package]
autotests = false
name = "codemason-connectors"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Connector system for codemason: catalogue descriptors, store, providers, and the MCP bridge (spec `connectors`)"
repository = "https://github.com/thawkins/codemason"

[dependencies]
async-trait = { workspace = true }
flate2 = "1"
hex = { workspace = true }
codemason-config = { path = "../codemason-config" }
codemason-surface = { path = "../codemason-surface" }
codemason-types = { path = "../codemason-types" }
regex = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = "0.4"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
url = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
flate2 = "1"
serde_json = { workspace = true }
tar = "0.4"
tokio = { workspace = true }
zip = { workspace = true }

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
