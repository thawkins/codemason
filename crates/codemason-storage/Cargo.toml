[package]
name = "codemason-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors = ["Tim Hawkins"]
description = "SQLite persistence layer for codemason sessions, memories, journals, snapshots, and teams"
repository = "https://github.com/thawkins/codemason"

autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
codemason-types = { path = "../codemason-types" }

# Core async runtime
tokio = { version = "1.42", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = { workspace = true }

# Logging
tracing = "0.1"

# Database
rusqlite = { workspace = true }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
similar = { workspace = true }
blake3 = "1.6"
base64 = { workspace = true }
# SEC-codemason-storage-001 (SECTASKS T-017): AEAD for the credential store
# (replaces the unauthenticated XOR stream cipher).
chacha20poly1305 = "0.11"
uuid = { version = "1.23", features = ["v4", "serde"] }
rand = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
ctor = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }
tempfile = "3.14"

[[bench]]
name = "activity_log_bench"
harness = false

[lints]
workspace = true
