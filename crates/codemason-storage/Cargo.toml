[package]
name = "codemason-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors = ["Tim Hawkins"]
description = "SQLite persistence layer for codemason sessions, memories, journals, snapshots, and teams"
repository = "https://github.com/thawkins/codemason"

autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
codemason-types = { path = "../codemason-types" }

# Core async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Database
rusqlite = { workspace = true }

# Utilities
chrono = { workspace = true }
similar = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true }
# SEC-codemason-storage-001 (SECTASKS T-017): AEAD for the credential store
# (replaces the unauthenticated XOR stream cipher).
chacha20poly1305 = "0.11"
uuid = { workspace = true, features = ["serde"] }
rand = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
ctor = { workspace = true }
criterion = { workspace = true }
tempfile = "3.14"

[[bench]]
name = "activity_log_bench"
harness = false

[lints]
workspace = true
