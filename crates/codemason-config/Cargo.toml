[package]
autotests = false
name = "codemason-config"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Tim Hawkins"]
license = "MIT"
description = "Configuration system for codemason"

[features]
default = []

[dependencies]
codemason-types = { path = "../codemason-types" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
globset = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
ctor = { workspace = true }
tempfile = "3"
serial_test = "4"

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
