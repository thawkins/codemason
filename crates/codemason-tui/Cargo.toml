[package]
autotests = false
name = "codemason-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[build-dependencies]
chrono = { workspace = true }

[dependencies]
codemason-agent = { path = "../codemason-agent" }
codemason-bench = { path = "../codemason-bench" }
codemason-config = { path = "../codemason-config" }
codemason-types = { path = "../codemason-types" }
codemason-storage = { path = "../codemason-storage" }
codemason-codeindex = { path = "../codemason-codeindex" }
# Direct dep for bash safe-command/builtin-list helpers (source-of-truth); the
# agent-local crate::tool::bash copy is a dormant duplicate (DCREMOVALPLAN M2.3).
codemason-tools-core = { path = "../codemason-tools-core" }
codemason-tools-extended = { path = "../codemason-tools-extended" }
codemason-tools-vcs = { path = "../codemason-tools-vcs" }
codemason-server = { path = "../codemason-server" }
codemason-telemetry = { path = "../codemason-telemetry" }
dirs = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
arboard = { workspace = true }
image = { workspace = true }
html2text = { workspace = true }
pulldown-cmark = "0.13"

codemason-specs = { path = "../codemason-specs" }
codemason-research = { path = "../codemason-research" }
codemason-llm = { path = "../codemason-llm" }
codemason-plugins = { path = "../codemason-plugins" }
codemason-connectors = { path = "../codemason-connectors" }
async-trait = { workspace = true }
fs2 = { workspace = true }
lru = { workspace = true }
uuid = { workspace = true }
# Width/grapheme handling for the message/log line caches (must match
# ratatui's WordWrapper so pre-wrapped cache rows are stable).
unicode-segmentation = "1.12"
unicode-width = "0.2"

[features]
default = []
# Kept for backward compatibility; telemetry is now enabled by default.
telemetry = []

[dev-dependencies]
tempfile = "3.5"
axum = { workspace = true }
criterion = { workspace = true }
parking_lot = { workspace = true }
filetime = "0.2"
unicode-width = "0.2"

[[bench]]
name = "bench_markdown"
harness = false

[[bench]]
name = "bench_cursor"
harness = false

[[bench]]
name = "bench_history"
harness = false

[[bench]]
name = "bench_panels"
harness = false

[dependencies.tempfile]
version = "3.5"

[[test]]
name = "all"
path = "tests/all.rs"
