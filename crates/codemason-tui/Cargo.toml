[package]
autotests = false
name = "codemason-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[build-dependencies]
chrono = { workspace = true }

[dependencies]
codemason-app-core = { path = "../codemason-app-core" }
codemason-agent = { path = "../codemason-agent" }
codemason-config = { path = "../codemason-config" }
codemason-types = { path = "../codemason-types" }
codemason-storage = { path = "../codemason-storage" }
codemason-codeindex = { path = "../codemason-codeindex" }
# Direct dep for bash safe-command/builtin-list helpers (source-of-truth); the
# agent-local crate::tool::bash copy is a dormant duplicate (DCREMOVALPLAN M2.3).
codemason-tools-core = { path = "../codemason-tools-core" }
codemason-telemetry = { path = "../codemason-telemetry" }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
chrono = { workspace = true }

codemason-specs = { path = "../codemason-specs" }
codemason-llm = { path = "../codemason-llm" }
codemason-connectors = { path = "../codemason-connectors" }
# Width handling for the line caches (must match codemason-app-core's
# unicode-width and ratatui's WordWrapper so pre-wrapped cache rows are stable).
unicode-width = "0.2"

[features]
default = []
# Kept for backward compatibility; telemetry is now enabled by default.
telemetry = []

[dev-dependencies]
codemason-bench = { path = "../codemason-bench" }
codemason-plugins = { path = "../codemason-plugins" }
codemason-research = { path = "../codemason-research" }
codemason-tools-extended = { path = "../codemason-tools-extended" }
arboard = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
tempfile = "3.5"
axum = { workspace = true }
criterion = { workspace = true }
parking_lot = { workspace = true }
filetime = "0.2"
unicode-width = "0.2"

[[bench]]
name = "bench_panels"
harness = false

[[test]]
name = "all"
path = "tests/all.rs"
