[package]
autotests = false
name = "codemason-llm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors = ["Tim Hawkins"]
description = "LLM provider implementations for codemason (Anthropic, OpenAI, Gemini, Ollama, HuggingFace, Copilot, Generic OpenAI, Azure AI Foundry, Azure Resource, Amazon Bedrock)"
repository = "https://github.com/thawkins/codemason"

[features]
default = []

[dependencies]
codemason-types = { path = "../codemason-types" }
codemason-config = { path = "../codemason-config" }
async-trait = { workspace = true }

# Core async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# HTTP client
reqwest = { workspace = true, features = ["json", "stream"] }
bytes = "1"
futures = { workspace = true }
async-stream = { workspace = true }

# Utilities
chrono = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# `tests/test_stream_frame_handling.rs` captures a provider log line.
tracing-subscriber = { workspace = true }
ctor = { workspace = true }
# Only `tests/test_openrouter_provider.rs` builds a real `Storage`; the library
# reads keys through `codemason_types::provider_auth::ProviderAuthSource`.
codemason-storage = { path = "../codemason-storage" }
tempfile = "3.14"
# `test-util` lets the stall-guard test pause time instead of waiting 120 s.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
