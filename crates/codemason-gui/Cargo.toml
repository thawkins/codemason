[package]
name = "codemason-gui"
# One integration-test binary for the crate (see AGENTS.md, "Test Layout").
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "egui/eframe desktop frontend for codemason, rendering the frontend-neutral App"

[lints]
workspace = true

[dependencies]
codemason-agent = { path = "../codemason-agent" }
codemason-storage = { path = "../codemason-storage" }
codemason-app-core = { workspace = true }
codemason-connectors = { workspace = true }
# The Plugin Store dialog names the store kind (`StoreKind`).
codemason-plugins = { workspace = true }
codemason-types = { workspace = true }
codemason-config = { workspace = true }
codemason-tools-core = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
craft-dialogs = { workspace = true }
craft-keymap = { workspace = true }
craft-menu = { workspace = true }
craft-quit = { workspace = true }
craft-ui = { workspace = true, features = ["system_fonts"] }
craft-window = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
# Thumbnails of attached images in the transcript (`file://` URIs, decoded
# by `image` with the workspace's formats).
# `svg`, `svg_text` and `svg_images` rasterise SVGs (rendered Mermaid
# diagrams, SVG images in replies) with resvg: their labels in the system's
# fonts and their embedded raster images.
egui_extras = { version = "0.37", default-features = false, features = ["file", "image", "svg", "svg_text", "svg_images"] }
# Mermaid diagrams in the transcript, rendered to SVG in pure Rust (MIT);
# no CLI and no PNG writer (`default-features = false`).
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
# Reads an SVG's own size before it is rasterised (crate::image_load), so a
# huge SVG is drawn at a capped size. 0.45.1 is egui_extras' version: no
# new crates.
resvg = { version = "0.45.1", default-features = false }
# JPEG, GIF and WebP too: transcript images (attachments, images in replies)
# come in those formats; the workspace default is PNG only.
image = { workspace = true, features = ["jpeg", "gif", "webp"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ctor = { workspace = true }
codemason-codeindex = { path = "../codemason-codeindex" }
codemason-llm = { path = "../codemason-llm" }
egui_kittest = { workspace = true }
parking_lot = { workspace = true }
tempfile = "3.5"
unicode-width = "0.2"
tracing-subscriber = { workspace = true }

[[test]]
name = "all"
path = "tests/all.rs"
