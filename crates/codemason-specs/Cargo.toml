[package]
name = "codemason-specs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors = ["Tim Hawkins"]
description = "Spec management system for codemason: EARS notation specs, validation, and lifecycle tracking"
repository = "https://github.com/thawkins/codemason"

autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
# Shared `/new` scaffold flag parser (spec `govdoc` T-002): `/spec govcreate`
# delegates its trailing flags here so accepted values and error text cannot
# drift from the `/new` surface.
codemason-tools-extended = { path = "../codemason-tools-extended" }
# `strutil::lowercase_range_to_original` maps search matches back to the spec text.
codemason-types = { path = "../codemason-types" }
serde = { workspace = true }
# Completion timestamps in PLAN.md status cells are RFC 3339 UTC strings.
chrono = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
tokio = { version = "1.42", features = ["fs", "io-util"] }
tracing = { workspace = true }

[dev-dependencies]
ctor = { workspace = true }
tokio = { workspace = true }
tempfile = "3"
serde_json = { workspace = true }

[lints]
workspace = true
