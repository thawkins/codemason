[package]
name = "codemason-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true

[dependencies]
codemason-agent = { path = "../codemason-agent" }

codemason-research = { path = "../codemason-research" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true, features = ["cors", "timeout"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
uuid = { workspace = true }
blake3 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
# Automation service surface (spec `openhands` T-016): run-history types and
# the schedule next-due computation.
codemason-types = { workspace = true }
codemason-config = { path = "../codemason-config" }
chrono = { workspace = true }

[dev-dependencies]
ctor = { workspace = true }
# `tower::ServiceExt::oneshot` drives the router in tests; production code
# only needs `tower-http`.
tower = { workspace = true }
criterion = { workspace = true }
parking_lot = { workspace = true }
http-body-util = "0.1"
# `ServeDir` is only exercised by `tests/test_web_ui.rs`; production serves the
# embedded UI without it.
tower-http = { workspace = true, features = ["fs"] }
# The OpenAI-surface integration test scripts a local `Provider`/`LlmClient`
# so the agent loop can run without a network call; `async-trait` is needed to
# implement those traits (`codemason-types`, for the shared message/thinking
# types the mock returns, is already a normal dependency).
async-trait = { workspace = true }

[[bench]]
name = "bench_sse"
harness = false
